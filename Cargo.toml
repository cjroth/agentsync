[workspace]
resolver = "2"
members = [
    "crates/agentsync-core",
    "crates/agentsync-cli",
    "tests/e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["agentsync contributors"]
rust-version = "1.89"

[workspace.dependencies]
automerge = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
futures-util = "0.3"
notify = "6"
notify-debouncer-full = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
unicode-normalization = "0.1"
async-trait = "0.1"
url = "2"
bytes = "1"
walkdir = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
